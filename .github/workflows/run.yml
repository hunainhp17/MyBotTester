name: My Private Stress Test
on: workflow_dispatch

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Clone and Build Tool
        run: |
          git clone https://github.com/KofS-Team/Hydrazine.git
          cd Hydrazine
          chmod +x gradlew
          ./gradlew shadowJar

      - name: Launch My Bots
        run: |
          # Finding the built jar and running it
          JAR_PATH=$(find Hydrazine/build/libs -name "*.jar" | head -n 1)
          # This joins 50 bots and sends your register command
          java -jar $JAR_PATH lapatasmp.fun 25565 50 1.20.1 -login "/register 1234555 1234555" -chat "Testing PakSMP!"
