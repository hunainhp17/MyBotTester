name: My Private Stress Test
on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Bot Tool
        run: |
          # Downloading a clean, working bot engine
          curl -L -o minedos.jar https://github.com/Annihilation786/Minedos-CLI/releases/download/1.2.1/Minedos.jar

      - name: Launch My Bots
        run: |
          # Running the bots on lapatasmp.fun
          # -reg: handles the registration, -msg: sends the chat message
          java -jar minedos.jar -ip lapatasmp.fun -port 25565 -version 1.20.1 -amount 50 -reg "/register 1234555 1234555" -msg "Testing PakSMP Protection!"
