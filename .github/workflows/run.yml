name: My Private Stress Test
on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Bot Tool
        run: |
          # Downloading a guaranteed working jar
          curl -L -o bot.jar https://github.com/crpmax/mc-bots/releases/download/v1.1/mc-bots.jar

      - name: Launch My Bots
        run: |
          # -s: server, -c: count, -r: random names
          # This command joins bots, registers them, and sends a chat message
          java -jar bot.jar -s lapatasmp.fun:25565 -c 50 -r -login "/register 1234555 1234555" -chat "Testing PakSMP protection!"
