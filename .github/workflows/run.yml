name: My Private Stress Test
on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download SoulFire
        run: |
          # Downloading the official stable CLI version
          curl -L -o soulfire.jar https://github.com/soulfiremc-com/SoulFire/releases/download/v1.1.0/soulfire-cli.jar

      - name: Launch My Bots
        run: |
          # Connecting to lapatasmp.fun with registration and chat
          java -jar soulfire.jar --host lapatasmp.fun --port 25565 --amount 50 --script "wait 3000; send /register 1234555 1234555; wait 5000; send Hello PakSMP!; repeat 5 5000: send Testing defenses..."
